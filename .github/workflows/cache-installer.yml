name: Cache KNC Printer installer in repository

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cache-v2.8.3.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download installer
        run: |
          mkdir -p packages/v2.8.3
          curl -L --fail --retry 3 \
            -o packages/v2.8.3/KNC-PRINTER-Setup.exe \
            https://github.com/knctech/KNC-Print-Releases/releases/download/v2.8.3/KNC-PRINTER-Setup.exe
          test -s packages/v2.8.3/KNC-PRINTER-Setup.exe

      - name: Commit installer to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/v2.8.3/KNC-PRINTER-Setup.exe
          if git diff --cached --quiet; then
            echo "Installer already present; nothing to commit."
            exit 0
          fi
          git commit -m "Add KNC Printer v2.8.3 installer [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
